spring:
  application:
    name: student-service
  datasource:
    url: ${STUDENT_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusenroll}
    username: ${STUDENT_SERVICE_DATASOURCE_USERNAME:campus}
    password: ${STUDENT_SERVICE_DATASOURCE_PASSWORD:campus_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

