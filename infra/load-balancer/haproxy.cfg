global
  log stdout format raw local0
  maxconn 1024

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option redispatch
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend course_gateway
  bind *:8080

  acl course_catalog path_beg /api/courses /api/periods /api/sections
  acl course_health path -i /health /health/course
  acl course_health_alias path -i /health/course

  http-request set-path /health if course_health_alias
  http-request return status 404 content-type text/plain lf-string "Route not exposed in the S25 application failover demo.\n" if !course_catalog !course_health
  use_backend course_service_pool if course_catalog
  use_backend course_service_pool if course_health

backend course_service_pool
  balance first
  default-server init-addr last,libc,none inter 3s fall 2 rise 2
  option httpchk GET /health
  http-check expect status 200
  server course-service course-service:8082 check
  server course-service-replica course-service-replica:8082 check backup

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s
  stats show-legends
